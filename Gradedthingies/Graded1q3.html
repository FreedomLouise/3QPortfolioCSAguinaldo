<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

</head>
  <body>
     <header>
        <div>
            <img src="https://ph.pinterest.com/pin/233976143135768649/" alt="logo" 
               title="The Official Logo" width="50px" height="50px" />
            <h1>
                Sapienara Club Application    
            </h1>
            <h3>by Freedom Louise Aguinaldo </h3>
        </div>
        <nav class="menubar">
            <a href="../index.html"> Home </a>
            <a href="/Gradedthingies/registerArea.html"> Show Saved Accounts </a>
        </nav>
    </header>
    <section>
      <h1 class="title">Sign-ups</h1>
      <form id="dForm" action="registerArea.html" method="get">
        <fieldset>
          <legend>Please Credit Credentials</legend><br/>

          <label> Full name: 
            <input type="text" name="name" id="uname" required />
          </label><br/><br/>
          <label> Birthday: 
            <input type="text" name="bday" id="uname" required />
          </label><br/><br/>
          <label> Email Address: 
            <input type="text" name="email" id="uname" required />
          </label><br/><br/>
          <label> Mobile Number: 
            <input type="text" name="num" id="uname" required />
          </label><br/><br/>
          <label for="grade">Grade Level:
            <select name="grade" id="grade">
               <option value="choose">choose</option>
               <option value="grade 7">Grade 7</option>
               <option value="grade 8">Grade 8</option>
               <option value="grade 9">Grade 9</option>
               <option value="grade 10">Grade 10</option>
               <option value="grade 11">Grade 11</option>
               <option value="grade 12">Grade 12</option>
            </select>
            </label><br/><br/>
          <label> Intern or Extern:
            <input type="radio" name="idkwhattheycalled" value="Intern" /> Intern
            <input type="radio" name="idkwhattheycalled" value="Extern" /> Extern
          </label><br/><br/>
          <label for="club"> Preferred Club/Organization:
            <select name="club" id="club">
               <option value="choose">choose</option>
               <option value="care">CARE</option>
               <option value="atom">ATOM</option>
               <option value="sapienara">Sapienara</option>
               <option value="munwha">Munwha</option>
               <option value="kamalayan">Kamalayan</option>
            </select>
            </label><br/><br/>
            <label> Why do you want to join: 
            <textarea name="about" id="about">
              
            </textarea>
          </label><br/><br/>
          
          
          
        </fieldset>  
        <fieldset>
          <legend>Submit</legend>
          <button type="submit"> Submit </button>
          <input type="reset" value=" Clear " />
        </fieldset> 
      </form>
    </section>
    <script src="q3e3script.js"></script>
  </body>
