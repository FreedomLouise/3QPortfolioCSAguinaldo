<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Rating</title>

<style>
body{
    font-family: 'Tahoma';
    background-image: url(https://i.pinimg.com/736x/c9/38/ec/c938eccf2308208f80eec45e0aed38e7.jpg);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    margin: 10px;
}

form{
    background-color: white;
    border:1px solid gray;
    padding:30px;
    width:500px;
    border-radius: 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    margin: 40px auto;

}

input, select{
    width:95%;
    padding:5px;
    margin-bottom:10px;
}

button{
    padding:8px;
    width:100%;
}

.star{
    font-size:25px;
    cursor:pointer;
    color:rgb(214, 214, 214);
}

.star.selected{
    color:gold;
}

.movieBox{
    border:1px solid black;
    padding:10px;
    margin: 10px auto; 
    width:500px;
    background-color: white;
    border-radius: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.movieStars{
    color:gold;
}

</style>
</head>

<body>

<div style="text-align: center;">
    <img src="https://i.pinimg.com/originals/9c/9e/73/9c9e73c1109de2dbaa9c947fb2bdefad.gif" width="50%">
</div>

<div style="text-align: center;">
    <h2>Add a Movie</h2>
</div>

<form onsubmit="addMovie(event)">

<label>Title:</label>
<input type="text" id="title" required>

<label>Year:</label>
<input type="number" id="year" required>

<label>Genre:</label>
<select id="genre">
<option>Action</option>
<option>Comedy</option>
<option>Drama</option>
<option>Fantasy</option>
<option>Horror</option>
</select>

<label>Rating:</label>
<div id="stars">
<span class="star" onclick="setRating(1)">★</span>
<span class="star" onclick="setRating(2)">★</span>
<span class="star" onclick="setRating(3)">★</span>
<span class="star" onclick="setRating(4)">★</span>
<span class="star" onclick="setRating(5)">★</span>
</div>

<br>

<button type="submit">Add Movie</button>

</form>

<div style="text-align: center;">
    <h2>Movie List</h2>
</div>

<div id="movieList"></div>

<script>

let rating = 0;

function setRating(value){
    rating = value;
    let stars = document.querySelectorAll(".star");

    stars.forEach((star,index)=>{
        if(index < value){
            star.classList.add("selected");
        }else{
            star.classList.remove("selected");
        }
    });
}

function addMovie(event){
    event.preventDefault();

    let title = document.getElementById("title").value;
    let year = document.getElementById("year").value;
    let genre = document.getElementById("genre").value;

    let movie = {
        title:title,
        year:year,
        genre:genre,
        rating:String(rating)
    };

    let movies = JSON.parse(localStorage.getItem("movies")) || [];

    movies.push(movie);

    localStorage.setItem("movies", JSON.stringify(movies));

    displayMovies();

    document.querySelector("form").reset();
}

function displayMovies(){

    let movies = JSON.parse(localStorage.getItem("movies")) || [];
    let movieList = document.getElementById("movieList");

    movieList.innerHTML = "";

    movies.forEach(movie => {

        let stars = "★".repeat(movie.rating);

        movieList.innerHTML += `
        <div class="movieBox">
        ${movie.title} (${movie.year}) - ${movie.genre}<br>
        Rating: <span class="movieStars">${stars}</span>
        </div>
        `;
    });
}

displayMovies();


</script>

<br/>

<h4>Resources:</h4>
<p>Pinterest. (n.d). W3 GIF - W3 - Discover & Share GIFs. https://ph.pinterest.com/pin/67483694410430993/</p>

</body>
</html>
