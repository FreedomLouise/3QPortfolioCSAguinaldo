<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saved Accounts</title>
  <link rel="stylesheet" href="./meowmeow.css">
  <style>
    table {
      border-collapse: collapse;
      width: 90%;
      margin: 20px auto;
      background-color: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f1f1f1;
    }
    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    h1.title {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>
<header>
  <nav class="navbar">
    <a href="../index.html">Home</a>
    <a href="/public/Q3graded1.html">Create Account</a>
  </nav>
</header>

<section>
  <h1 class="title">Account Saved In Your Computer</h1>

  <table id="results" border="1">
    <thead>
      <tr>
        <th>Club</th>
        <th>ID</th>
        <th>Full Name</th>
        <th>Grade</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Intern/Extern</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script>
  const resultsBody = document.querySelector("#results tbody");
  const acctString = localStorage.getItem("accounts");

  if (!acctString) {
    resultsBody.innerHTML = `<tr><td colspan="7" style="text-align:center">No Accounts Found</td></tr>`;
  } else {
    const accountList = JSON.parse(acctString);

    for (let id in accountList) {
      const a = accountList[id];
      resultsBody.innerHTML += `
        <tr>
          <td>${a.club}</td>
          <td>${id}</td>
          <td>${id}</td>
          <td>${a.grade}</td>
          <td>${a.email}</td>
          <td>${a.num}</td>
          <td>${a.idkwhattheycalled}</td>
        </tr>
      `;
    }
  }
</script>
</body>
</html>
